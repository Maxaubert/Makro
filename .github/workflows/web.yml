name: web

on:
  pull_request:
    paths: ["apps/web/**", "packages/contracts/**", ".github/workflows/web.yml"]
  push:
    branches: [master]
    paths: ["apps/web/**", "packages/contracts/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and golden-file tests (Vitest)
        run: npm test
