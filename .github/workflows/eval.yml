name: eval

on:
  pull_request:
    paths: ["eval/**", ".github/workflows/eval.yml"]
  push:
    branches: [master]
    paths: ["eval/**"]

jobs:
  voice-scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice scorer tests
        run: python -I -m unittest discover -s eval/voice
