name: deploy-functions

# The Supabase GitHub integration deploys migrations but not Edge Functions (observed 2026-10-18).
on:
  push:
    branches: [master]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set, skipping the deploy."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.set == 'true'
        with:
          version: 2.121.0
      - name: Deploy the Edge Functions
        if: steps.token.outputs.set == 'true'
        run: supabase functions deploy --project-ref qhzytbcqzaauzckafhsj
