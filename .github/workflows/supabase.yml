name: supabase

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  push:
    branches: [master]
    paths: ["supabase/**"]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start a local database and apply the migrations
        run: supabase db start
      - name: Database tests (RLS on every table, no anonymous access)
        run: supabase test db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests
        run: deno test supabase/functions/
